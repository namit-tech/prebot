<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PreBot - Mobile Assistant</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        .header {
            padding: 15px;
            background: #222;
            text-align: center;
            border-bottom: 2px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #667eea;
            letter-spacing: 1px;
        }

        /* --- Main Content Area (Scrollable) --- */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #777;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* --- Option 1: Preset Container --- */
        .presets-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .preset-card {
            background: #333;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .preset-card:active {
            background: #444;
            border-color: #667eea;
            transform: scale(0.98);
        }

        .preset-card .q-text {
            font-size: 15px;
            font-weight: 500;
        }

        .preset-card i {
            color: #667eea;
            font-size: 12px;
        }

        /* --- Option 2 & 3: Command Center (Footer) --- */
        .command-center {
            background: #222;
            padding: 20px;
            border-top: 1px solid #333;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        /* --- Mic Pill --- */
        .mic-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mic-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #667eea;
            border: none;
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            z-index: 2;
        }

        .mic-btn.listening {
            background: #ef4444;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* --- Input Group --- */
        .input-group {
            width: 100%;
            display: flex;
            background: #111;
            border-radius: 10px;
            padding: 5px;
            border: 1px solid #444;
            align-items: center;
        }

        #chatInput {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background: #333;
            color: #667eea;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .send-btn:active {
            background: #444;
            color: #fff;
        }

        /* --- Status --- */
        #status {
            font-size: 11px;
            color: #555;
            text-align: center;
            margin-bottom: 5px;
        }

        /* --- Login Overlay --- */
        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a1a;
            z-index: 1000;
            display: none;
            flex-direction: column;
            padding: 40px 20px;
            align-items: center;
            justify-content: center;
        }

        .overlay.active { display: flex; }

        .login-card {
            width: 100%;
            max-width: 350px;
            background: #222;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #333;
            text-align: center;
        }

        .login-card input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 10px;
            font-size: 16px;
        }

        .login-card button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        #debugConsole {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 200px;
            background: rgba(0,0,0,0.9);
            color: lime;
            font-family: monospace;
            padding: 10px;
            font-size: 10px;
            overflow-y: auto;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <i class="fas fa-robot"></i>
        <h1>PREBOT MOBILE</h1>
        <button onclick="mobileApp.logout()" style="background:none; border:none; color:#555"><i class="fas fa-sign-out-alt"></i></button>
    </div>

    <!-- Scrollable Content -->
    <div class="content-area">
        <div id="presetsSection">
            <div class="section-title">Quick Presets</div>
            <div id="presetsContainer" class="presets-grid">
                <div style="text-align:center; color:#555; padding: 20px">
                    <i class="fas fa-spinner fa-spin"></i> Loading...
                </div>
            </div>
        </div>
    </div>

    <!-- Command Center -->
    <div class="command-center">
        <div id="status">Ready to assist</div>



        <!-- Pillar 3: Direct Type -->
        <div class="input-group">
            <input type="text" id="chatInput" placeholder="Pillar 3: Ask anything...">
            <button class="send-btn" id="sendButton" onclick="mobileApp.sendChatMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Login Overlay -->
    <div id="loginOverlay" class="overlay">
        <div class="login-card">
            <img src="assets/logo.png" alt="Logo" style="width: 80px; height: 80px; border-radius: 15px; margin-bottom: 20px;">
            <h3>Assistant Setup</h3>
            <p style="color:#777; font-size:14px">Connect to your Desktop App</p>
            <input type="text" id="loginIP" placeholder="PC IP Address (e.g. 192.168.1.5)">
            <input type="email" id="loginEmail" placeholder="Your Email">
            <button onclick="mobileApp.login()">Connect Pillars</button>
            <p id="loginError" style="color:#ef4444; margin-top:10px; font-size:12px; display:none"></p>
        </div>
    </div>

    <!-- Debug Console -->
    <div id="debugConsole"></div>
    <button onclick="document.getElementById('debugConsole').style.display = 'block'" style="position:fixed; bottom:0; right:0; width:30px; height:30px; opacity:0; z-index:9999"></button>

    <!-- Scripts -->
    <script src="capacitor-mobile.js"></script>
    <script src="mobile-bridge-bundle.js"></script>

    <script>
        function log(msg, type='info') {
            const consoleEl = document.getElementById('debugConsole');
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            entry.style.color = type === 'error' ? '#ff6b6b' : '#0f0';
            consoleEl.prepend(entry);
            console.log(msg);
        }

        class MobileApp {
            constructor() {
                this.desktopIP = localStorage.getItem('mobile_host_ip');
                this.userEmail = localStorage.getItem('mobile_auth_email');
                this.isListening = false;
                
                // micBtn and listeners removed
                this.chatInput = document.getElementById('chatInput');
                this.status = document.getElementById('status');
                this.presetsContainer = document.getElementById('presetsContainer');
                this.loginOverlay = document.getElementById('loginOverlay');
                
                this.init();
            }

            async init() {
                if (!this.userEmail || !this.desktopIP) {
                    this.showLogin();
                } else {
                    await this.checkActiveModule();
                    this.setupSpeech();
                }
                
                // Poll for module changes every 5 seconds
                setInterval(() => this.checkActiveModule(), 5000);
            }

            async checkActiveModule() {
                try {
                    const res = await fetch(`http://${this.desktopIP}:3000/api/active-module`);
                    const data = await res.json();
                    const mode = data.activeModule || 'predefined';
                    const forcePresets = data.mobilePresetsEnabled || false;
                    const isAIBrainAuthorized = data.isAIBrainAuthorized || false;
                    const aiName = isAIBrainAuthorized ? 'AI' : 'Predefined';
                    
                    const presetsSection = document.getElementById('presetsSection');
                    const chatInputSection = document.querySelector('.input-group');
                    const statusSection = document.getElementById('status');
                    const chatInput = document.getElementById('chatInput');

                    // If not authorized for AI Brain, hide free-text
                    if (!isAIBrainAuthorized) {
                        if (chatInputSection) chatInputSection.style.display = 'none';
                        if (statusSection) statusSection.textContent = 'Predefined Q&A Mode';
                    } else {
                        if (chatInputSection) chatInputSection.style.display = 'flex';
                    }

                    if (mode === 'predefined' || forcePresets) {
                        if (presetsSection) presetsSection.style.display = 'block';
                        if (chatInput) chatInput.placeholder = (mode === 'predefined' ? "Search for a question..." : `Ask ${aiName} Brain anything...`);
                        this.loadPresets();
                    } else {
                        if (presetsSection) presetsSection.style.display = 'none';
                        if (chatInput) chatInput.placeholder = `Ask ${aiName} Brain anything...`;
                    }
                } catch (e) {
                    log('Mode Check Failed: ' + e.message, 'error');
                    // Fallback to presets if server unreachable
                    this.loadPresets();
                }
            }

            showLogin() { this.loginOverlay.classList.add('active'); }

            async loadPresets() {
                try {
                    const res = await fetch(`http://${this.desktopIP}:3000/api/questions`);
                    const questions = await res.json();
                    this.presetsContainer.innerHTML = '';
                    
                    if (!questions || questions.length === 0) {
                        this.presetsContainer.innerHTML = '<div style="text-align:center; color:#555">No presets found.</div>';
                        return;
                    }

                    questions.forEach(q => {
                        const card = document.createElement('div');
                        card.className = 'preset-card';
                        card.innerHTML = `<span class="q-text">${q.question}</span><i class="fas fa-chevron-right"></i>`;
                        card.onclick = () => this.sendPreset(q);
                        this.presetsContainer.appendChild(card);
                    });
                } catch (e) {
                    log('Load Presets Failed: ' + e.message, 'error');
                }
            }

            async sendPreset(q) {
                this.status.textContent = 'Syncing preset...';
                try {
                    await fetch(`http://${this.desktopIP}:3000/api/ask`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ questionIndex: 0, question: q.question, answer: q.answer })
                    });
                    this.status.textContent = 'Preset Playback Triggered';
                } catch (e) { log('Preset Error: ' + e.message, 'error'); }
            }

            setupSpeech() {
                if (window.CapacitorSpeech) {
                    log('✅ Voice Pillar Ready');
                }
            }

            async toggleMic() {
                if (this.isListening) {
                    this.stopListening();
                } else {
                    this.startListening();
                }
            }

            async startListening() {
                this.isListening = true;
                this.micBtn.classList.add('listening');
                this.status.textContent = 'Listening to Voice...';
                
                if (window.CapacitorSpeech) {
                    window.CapacitorSpeech.start({ language: "en-US", prompt: "Speak now..." })
                    .then(result => {
                        if (result?.matches?.length > 0) {
                            this.chatInput.value = result.matches[0];
                            this.sendChatMessage();
                        }
                    }).finally(() => this.stopListening());
                } else {
                    alert('NATIVE APP MODE REQUIRED FOR VOICE');
                    this.stopListening();
                }
            }

            stopListening() {
                this.isListening = false;
                this.micBtn.classList.remove('listening');
                this.status.textContent = 'Pillars Active';
                if (window.CapacitorSpeech) window.CapacitorSpeech.stop();
            }

            async sendChatMessage() {
                const text = this.chatInput.value.trim();
                if (!text) return;
                
                this.status.textContent = 'Sending to AI Brain...';
                try {
                    const res = await fetch(`http://${this.desktopIP}:3000/api/chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, email: this.userEmail, model: "gemma" })
                    });
                    if (res.ok) {
                        this.chatInput.value = '';
                        this.status.textContent = 'AI Processing... Check PC';
                    }
                } catch (e) { log('Chat Error: ' + e.message, 'error'); }
            }

            async login() {
                const email = document.getElementById('loginEmail').value;
                const ip = document.getElementById('loginIP').value;
                if (!email || !ip) return alert('Enter details');

                try {
                    const res = await fetch(`http://${ip}:3000/api/mobile-login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    if (data.success) {
                        localStorage.setItem('mobile_auth_email', email);
                        localStorage.setItem('mobile_host_ip', ip);
                        location.reload();
                    } else {
                        alert(data.message);
                    }
                } catch (e) { alert('Connection failed: ' + e.message); }
            }

            logout() {
                localStorage.clear();
                location.reload();
            }
        }

        window.mobileApp = new MobileApp();
    </script>
</body>
</html>
